# Bot work sites. Override or add sites without rebuilding by copying this file to
# .data/bots/bot-sites.toml (sites there replace bundled sites with the same key) and running
# ::bot sites reload. Routes start next to the bank; keep waypoints within ~40 tiles of each
# other and away from closed doors. Use ::bot here in-game to print your tile when recording one.
