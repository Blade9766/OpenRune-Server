[gamevals.varp]
# Server-only: 1 while a greegree has the player in monkey form, read by the Ape Atoll hunt modes.
# 65400-65405 are upstream's motherlode varps; this is a Temp varp so the id is free to move.
mm_greegree_form = 65478

# The Dig Site: the quest's own flags. The stage itself lives in the cache varp
# `varp.itexamlevel`, and the multiloc flags on `varp.itdigsitemulti`.
# A varbit's base varp is a u16 in the cache, so any varp that carries varbits must stay below
# 65536; above it the id wraps round onto a real varp (65658 landed on `varp.squire`).
digsite_state = 65441

# Temple of Ikov: the quest's own flags. The stage itself lives in the cache varp `varp.ikov`,
# and which Lucien is standing where in the cache varbit `varbit.ikov_lucien_vis`.
ikov_state = 65440

# The Tourist Trap: the quest's own flags. The stage lives in the cache varp `varp.desertrescue`
# and everything the client draws (Irena, Ana, the escaping slave, the bent bars, the barrels and
# the cart) in the cache varbits on `varp.tourtrap_qip_var`.
touristtrap_state = 65442

# Death Plateau: the quest's own flags and Harold's purse. The stage lives in the cache varp
# `varp.death_equiproom`. The dice varp is Temp: a stake left on the table at logout is lost.
deathplateau_state = 65455
deathplateau_dice = 65456

# The Fremennik Trials: the council's votes and each trial's own progress. The stage itself lives
# in the cache varp `varp.viking`. The Temp varp holds Koschei's form and the letters dialled into
# Peer's combination lock.
fremtrials_state = 65444
fremtrials_progress = 65445
fremtrials_temp = 65446

